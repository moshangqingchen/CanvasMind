<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:"><title>超级画布</title>
<style>body{margin:0;background:#f6f6f4;color:#242a29;font:16px 'Segoe UI','Microsoft YaHei',sans-serif;display:grid;place-items:center;height:100vh}main{width:min(580px,80vw)}.mark{font-size:64px;color:#628b79}h1{font-size:32px;letter-spacing:2px;margin:12px 0}p{line-height:1.8;color:#626b68}button{border:1px solid #d7ded9;border-radius:9px;padding:12px 18px;margin:8px 8px 0 0;background:white;color:#293e33;cursor:pointer;font:inherit}button.primary{background:#35604b;color:white}button:disabled{opacity:.5;cursor:wait}#detail{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}#actions[hidden]{display:none}</style></head>
<body><main><div class="mark">✦</div><h1>超级画布</h1><p id="message">正在启动…</p><p id="detail"></p><div id="actions" hidden><button class="primary" data-action="migrate">迁移现有数据</button><button data-action="fresh">从空白开始</button></div><button id="retry" hidden>重试</button><button id="logs">打开日志</button></main><script src="startup.js"></script></body></html>
