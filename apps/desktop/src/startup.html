<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:"><title>超级画布</title>
<style>:root{color-scheme:light;--canvas:#F3F5F7;--surface:#fff;--title:#0F172A;--text:#334155;--muted:#64748B;--border:rgba(15,23,42,.12);--primary:#0F172A;--on-primary:#fff}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--canvas:#0E0F12;--surface:#17181C;--title:#F1F5F9;--text:#CBD5E1;--muted:#94A3B8;--border:rgba(255,255,255,.12);--primary:#F8FAFC;--on-primary:#0F172A}}body{margin:0;background:var(--canvas);color:var(--title);font:16px 'Segoe UI','Microsoft YaHei',sans-serif;display:grid;place-items:center;height:100vh}main{width:min(580px,80vw)}.mark{font-size:64px;color:var(--text)}h1{font-size:32px;letter-spacing:2px;margin:12px 0}p{line-height:1.8;color:var(--muted)}button{border:1px solid var(--border);border-radius:9px;padding:12px 18px;margin:8px 8px 0 0;background:var(--surface);color:var(--text);cursor:pointer;font:inherit}button.primary{background:var(--primary);color:var(--on-primary)}button:focus-visible{outline:2px solid var(--primary);outline-offset:3px}button:disabled{opacity:.5;cursor:wait}#detail{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}#actions[hidden]{display:none}</style></head>
<body><main><div class="mark">✦</div><h1>超级画布</h1><p id="message">正在启动…</p><p id="detail"></p><div id="actions" hidden><button class="primary" data-action="migrate">迁移现有数据</button><button data-action="fresh">从空白开始</button></div><button id="retry" hidden>重试</button><button id="logs">打开日志</button></main><script src="startup.js"></script></body></html>
