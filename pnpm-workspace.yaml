packages:
  - "apps/desktop"
  - "apps/desktop/renderer"
  - "packages/*"
allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - electron@44.4.1
overrides:
  browserslist: 4.28.7
  js-yaml@^4.1.0: 4.3.2
  "brace-expansion@>=1 <2": 1.1.18
  "brace-expansion@>=5 <6": 5.0.9
  "postcss@>=8 <8.5.23": 8.5.23
  "source-map-js@<1.2.2": 1.2.2
