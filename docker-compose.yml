name: supercanvas

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supercanvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-supercanvas}
    volumes:
      - supercanvas-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2.5-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"',
      ]
    volumes:
      - supercanvas-redis:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - supercanvas-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_APP_USER: ${MINIO_APP_USER:?MINIO_APP_USER is required}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?MINIO_APP_PASSWORD is required}
      MINIO_BUCKET: ${S3_BUCKET:-supercanvas}
    volumes:
      - ./infra/minio/cors.xml:/config/cors.xml:ro
      - ./infra/minio/init.sh:/config/init.sh:ro
    entrypoint: ["/bin/sh", "/config/init.sh"]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command: ["pnpm", "--filter", "@super-canvas/db", "db:migrate"]

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-超级画布}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      USE_MEMORY_STORE: "false"
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      RUN_IN_PROCESS: "false"
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:${MINIO_API_PORT:-9000}}
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_APP_USER:?MINIO_APP_USER is required}
      S3_SECRET_KEY: ${MINIO_APP_PASSWORD:?MINIO_APP_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-supercanvas}
      S3_FORCE_PATH_STYLE: "true"
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SUPERCANVAS_PUBLIC_AUTH_USER: "${SUPERCANVAS_PUBLIC_AUTH_USER:-}"
      SUPERCANVAS_PUBLIC_AUTH_PASSWORD: "${SUPERCANVAS_PUBLIC_AUTH_PASSWORD:-}"
      SUPERCANVAS_PUBLIC_AUTH_SESSION_TOKEN: "${SUPERCANVAS_PUBLIC_AUTH_SESSION_TOKEN:-}"
      SUPERCANVAS_PUBLIC_AUTH_TRUSTED_HOSTS: "${SUPERCANVAS_PUBLIC_AUTH_TRUSTED_HOSTS:-}"
      SUPERCANVAS_PUBLIC_AUTH_ALLOW_LOOPBACK: "${SUPERCANVAS_PUBLIC_AUTH_ALLOW_LOOPBACK:-}"
      WEAI_DIRECT_LOCAL_ADDRESS: "${WEAI_DIRECT_LOCAL_ADDRESS:-}"
      WEAI_DIRECT_DNS_SERVERS: "${WEAI_DIRECT_DNS_SERVERS:-223.5.5.5,119.29.29.29}"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const token=process.env.SUPERCANVAS_PUBLIC_AUTH_SESSION_TOKEN||'';const headers=token?{cookie:'super_canvas_session='+token}:{};fetch('http://127.0.0.1:3000/api/health',{headers}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      USE_MEMORY_STORE: "false"
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      RUN_IN_PROCESS: "false"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_APP_USER:?MINIO_APP_USER is required}
      S3_SECRET_KEY: ${MINIO_APP_PASSWORD:?MINIO_APP_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-supercanvas}
      S3_FORCE_PATH_STYLE: "true"
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required}
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-2}"
      WEAI_DIRECT_LOCAL_ADDRESS: "${WEAI_DIRECT_LOCAL_ADDRESS:-}"
      WEAI_DIRECT_DNS_SERVERS: "${WEAI_DIRECT_DNS_SERVERS:-223.5.5.5,119.29.29.29}"

volumes:
  supercanvas-postgres:
  supercanvas-redis:
  supercanvas-minio:
