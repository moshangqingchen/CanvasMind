name: Windows Desktop Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Select version for release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $tag) { throw "Tag and package version differ." }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and -not ($existing | ConvertFrom-Json).isDraft) {
            "publish=false" >> $env:GITHUB_OUTPUT
          } else {
            "publish=true" >> $env:GITHUB_OUTPUT
          }
          exit 0
  checks:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  desktop-release:
    needs: [prepare, checks]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json).version
          $desktopVersion = (Get-Content -Raw -LiteralPath apps/desktop/package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw "Release tag $env:RELEASE_TAG does not match package.json version $version." }
          if ($desktopVersion -ne $version) { throw "Desktop version $desktopVersion does not match package.json version $version." }
          if (-not (Test-Path -LiteralPath "docs/releases/$($env:RELEASE_TAG).md")) { throw "Versioned release notes are required." }
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows desktop installer
        run: pnpm desktop:build

      - name: Supplier capabilities and quality default regressions
        run: pnpm --filter @super-canvas/desktop-ui exec vitest run lib/supplier-image25-quality.test.ts lib/supplier-verification.test.ts lib/scanned-model-protocols.test.ts lib/mikoto-presets.test.ts lib/model-quality.test.ts lib/canvas-save-reliability.test.ts lib/node-configuration-journal.test.ts lib/model-parameters.test.ts lib/video-duration-control.test.ts lib/connection-model-snapshot.test.ts lib/node-config-pointer.test.ts lib/node-config-placement.test.ts

      - name: Install browser for parameter regression tests
        run: pnpm --filter @super-canvas/desktop-ui exec playwright install chromium

      - name: Supplier account billing regressions
        run: pnpm --filter @super-canvas/desktop-ui exec vitest run lib/supplier-billing.test.ts lib/supplier-billing-read.test.ts lib/client-supplier-billing.test.ts lib/model-display.test.ts lib/jijiu-pricing.test.ts

      - name: Verify quality defaults, supplier switching and saved selections
        run: pnpm --filter @super-canvas/desktop-ui exec playwright test e2e/canvas-declared-image-parameters.spec.ts e2e/canvas-supplier-picker.spec.ts e2e/supplier-billing.spec.ts e2e/app-update.spec.ts e2e/canvas-panel-zoom.spec.ts e2e/canvas-panel-interaction.spec.ts e2e/canvas-panel-nonoverlap.spec.ts e2e/canvas-layout-regression.spec.ts e2e/canvas-clipboard.spec.ts e2e/video-duration-controls.spec.ts e2e/supplier-audit-upgrade.spec.ts e2e/supplier-jijiu.spec.ts
        env:
          PLAYWRIGHT_CHANNEL: chromium

      - name: Desktop regression tests
        run: pnpm desktop:test

      - name: Packaged desktop smoke test
        run: pnpm --filter @super-canvas/desktop run smoke -- --packaged

      - name: Normal-window GPU startup and restart smoke test
        run: pnpm --filter @super-canvas/desktop run smoke -- --packaged --windowed

      - name: Preserve desktop rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-rendering-evidence
          path: |
            apps/desktop/release/smoke*.png
            apps/desktop/release/smoke*report.json
          retention-days: 7

      - name: Publish desktop installer and update artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/release"
          $installer = "SuperCanvas-Setup-$($env:APP_VERSION)-x64.exe"
          $artifacts = @($installer, "$installer.blockmap", "latest.yml") | ForEach-Object {
            $path = Join-Path $releaseDirectory $_
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Required desktop release artifact was not generated: $_" }
            $path
          }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            $notesPath = Join-Path $env:GITHUB_WORKSPACE "docs/releases/$($env:RELEASE_TAG).md"
            if (Test-Path -LiteralPath $notesPath -PathType Leaf) {
              gh release create $env:RELEASE_TAG --draft --target $env:GITHUB_SHA --title "超级画布 $env:RELEASE_TAG" --notes-file $notesPath
            } else {
              throw 'Versioned release notes are required.'
            }
            if ($LASTEXITCODE -ne 0) { throw 'Desktop release creation failed.' }
          }
          gh release upload $env:RELEASE_TAG @artifacts --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Desktop release upload failed.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Desktop release publication failed.' }
