name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Docker Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          MINIO_ROOT_USER: ci-minio-root
          MINIO_ROOT_PASSWORD: ci-minio-root-password
          MINIO_APP_USER: ci-minio-app
          MINIO_APP_PASSWORD: ci-minio-app-password
          DATABASE_URL: postgresql://supercanvas:ci-postgres-password@postgres:5432/supercanvas
          REDIS_URL: redis://:ci-redis-password@redis:6379
          MASTER_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Build packages and web app
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm --filter @super-canvas/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter @super-canvas/web e2e
        env:
          PLAYWRIGHT_CHANNEL: chromium
