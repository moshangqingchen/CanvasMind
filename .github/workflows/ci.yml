name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install video inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Build shared packages and embedded UI for quality checks
        run: pnpm build:runtime

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Cleanup boundary tests
        run: pnpm test:maintenance

  browser:
    name: Browser (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: functional-1
            arguments: --grep-invert '画布 50/200/500' --shard=1/3
          - suite: functional-2
            arguments: --grep-invert '画布 50/200/500' --shard=2/3
          - suite: functional-3
            arguments: --grep-invert '画布 50/200/500' --shard=3/3
          - suite: performance
            arguments: e2e/canvas-performance.spec.ts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install video inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Build shared packages and embedded UI
        run: pnpm build:runtime
      - name: Install Playwright Chromium
        run: pnpm --filter @super-canvas/desktop-ui exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter @super-canvas/desktop-ui exec playwright test ${{ matrix.arguments }}
        env:
          PLAYWRIGHT_CHANNEL: chromium

      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics-${{ matrix.suite }}
          path: |
            apps/desktop/renderer/test-results
            apps/desktop/renderer/playwright-report
          retention-days: 7

  desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build unpacked Windows app
        run: pnpm desktop:build --unpacked
      - name: Desktop regression tests
        run: pnpm desktop:test
      - name: Packaged desktop smoke test
        run: pnpm --filter @super-canvas/desktop run smoke -- --packaged
      - name: Normal-window GPU startup and restart smoke test
        run: pnpm --filter @super-canvas/desktop run smoke -- --packaged --windowed
      - name: Preserve desktop rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-rendering-evidence
          path: |
            apps/desktop/release/smoke*.png
            apps/desktop/release/smoke*report.json
          retention-days: 7
