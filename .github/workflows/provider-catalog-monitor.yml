name: Provider catalog monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  catalog-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test catalog contract monitor
        run: node --test scripts/check-provider-catalogs.test.mjs
      - name: Check provider pricing catalogs
        run: node scripts/check-provider-catalogs.mjs --output provider-catalog-report.json --strict
      - name: Upload catalog report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-catalog-report
          path: provider-catalog-report.json
